# events-bridge example configuration.
#
# Copy to /etc/events-bridge/config.toml (or pass `--config`) and adjust.
# Never commit the real file: it is listed in .gitignore.

[server]
# Behind Secure MCP Tunnel or Cloudflare Tunnel this can stay on loopback.
bind = "127.0.0.1:8787"

# Host header authorities accepted by the Streamable HTTP endpoint.
# Add the public hostname when the hub is exposed through a tunnel.
allowed_hosts = ["localhost", "127.0.0.1", "::1"]

# public_base_url = "https://bridge.example.com"

# Local event injection endpoint. Requires network-level protection. When
# `internal_token_env` is set, requests must present that separate token in
# `X-Internal-Token` (it does not reuse the MCP bearer token). When
# `[auth].token_env` is also configured, MCP bearer authentication applies
# independently.
enable_internal_ingest = false
# internal_token_env = "EVENTS_BRIDGE_INTERNAL_TOKEN"

[database]
path = "/var/lib/events-bridge/events.db"

[auth]
# Name of the environment variable containing the MCP bearer token.
# When omitted the hub runs unauthenticated (acceptable only on loopback).
# token_env = "EVENTS_BRIDGE_TOKEN"
principal = "chatgpt"

[subscriptions]
default_ttl_secs = 3600
min_ttl_secs = 60
max_ttl_secs = 86400

[delivery]
timeout_secs = 10
max_attempts = 5
base_backoff_ms = 1000
max_backoff_ms = 300000
# Protocol ceiling is 256 KiB; values above it are rejected at startup.
max_body_bytes = 262144
# A delivery left `in_progress` longer than this is reclaimed after a worker
# crash or a failed state update.
lease_secs = 300
poll_interval_ms = 5000

[logging]
level = "info,events_bridge=debug"

# T3 Code Collector (Phase 2).
#
# The collector opens T3 Code's state database read-only. It needs no token:
# T3 Code performs its own authentication. Enable this only on the host that
# runs T3 Code. `state_db_path` defaults to ~/.t3/userdata/statev2.sqlite and
# `environment_id` is read from the sibling `environment-id` file.
[collectors.t3]
enabled = false
# state_db_path = "/home/example/.t3/userdata/statev2.sqlite"
# environment_id = "59f9e9a5-51a0-41b4-9790-6bc8cbc2245e"
# environment_id_path = "/home/example/.t3/userdata/environment-id"
# Optional web base URL; deep links are only emitted when this is set.
# t3_web_base_url = "https://t3.example.com"
poll_interval_ms = 1000
watch_wal = true
batch_size = 500

# GitHub Collector (Phase 3).
#
# GitHub authenticates webhook deliveries with an HMAC-SHA256 signature, not
# the MCP bearer token. The secret and the optional REST API token are read
# from environment variables and must never be written to this file.
#
# `webhook_enabled` exposes POST /webhooks/github. `poll_enabled` periodically
# reconciles pull requests and workflow runs through the REST API (and needs at
# least one repository). Both paths can run together; duplicate CI failures are
# normalized by workflow run id and attempt.
[collectors.github]
webhook_enabled = false
poll_enabled = false

# Environment variable holding the GitHub webhook HMAC secret.
# Required when webhook_enabled = true.
# webhook_secret_env = "EVENTS_BRIDGE_GITHUB_WEBHOOK_SECRET"

# Optional environment variable holding a GitHub personal/app token. When set,
# the token is sent as `Authorization: Bearer ...` on REST reconciliation.
# token_env = "EVENTS_BRIDGE_GITHUB_TOKEN"

# Watched "owner/repo" entries. Required when poll_enabled = true. When set,
# webhook deliveries for other repositories are acknowledged and ignored.
repositories = []
# repositories = ["soramikan/events-bridge"]

api_base_url = "https://api.github.com"
poll_interval_secs = 60
# Accepted webhook body ceiling (at most 10 MiB).
max_webhook_body_bytes = 1048576
